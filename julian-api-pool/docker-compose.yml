services:
  app_proxy:
    environment:
      APP_HOST: julian-api-pool_server_1
      APP_PORT: 8787
      # API clients cannot send the umbrelOS login cookie; client keys protect /v1. The app icon and manifest carry no data.
      PROXY_AUTH_WHITELIST: "/v1/*,/healthz,/manifest.webmanifest,/icon.svg,/apple-touch-icon.png,/icon-512.png"

  server:
    image: ghcr.io/julian27sg/api-pool:0.4.3@sha256:e0293d3a89f265bf672f12109090188d5a133644b2ea43cfb72e0074ae59bc4b
    user: "1000:1000"
    restart: on-failure
    read_only: true
    # Node sizes its heap from the cgroup limit (about a quarter); 1536m leaves ~1 GB heap plus buffers.
    mem_limit: 1536m
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONFIG_PATH: /app/config/config.json
      SECRETS_DIR: /secrets
      DATA_DIR: /data
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8787"
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config:ro
      - ${APP_DATA_DIR}/data/secrets:/secrets:ro
      - ${APP_DATA_DIR}/data/db:/data
