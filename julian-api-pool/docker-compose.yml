services:
  app_proxy:
    environment:
      APP_HOST: julian-api-pool_server_1
      APP_PORT: 8787
      # API clients cannot send the umbrelOS login cookie; the pool key protects these paths.
      PROXY_AUTH_WHITELIST: "/v1/*,/healthz"

  server:
    image: ghcr.io/julian27sg/api-pool:0.3.1@sha256:1cdcf6de9900b075f416550dd67035f1595f43fab2b1a130d10dd33d45c791a8
    user: "1000:1000"
    restart: on-failure
    read_only: true
    # Node sizes its heap from the cgroup limit (about a quarter); 1536m leaves ~1 GB heap plus buffers.
    mem_limit: 1536m
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONFIG_PATH: /app/config/config.json
      SECRETS_DIR: /secrets
      DATA_DIR: /data
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8787"
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - ${APP_DATA_DIR}/data/config:/app/config:ro
      - ${APP_DATA_DIR}/data/secrets:/secrets:ro
      - ${APP_DATA_DIR}/data/db:/data
