manifestVersion: 1
id: julian-api-pool
storage:
  dataRoot: data
name: API Pool
tagline: One Anthropic API key, routed across your Console organizations by remaining credit
category: developer
version: "0.2.2"
port: 8787
description: >-
  api-pool sits in front of several Anthropic Console organizations and exposes a single pool key.
  Every request goes to the organization whose monthly subscriber credit still has balance and expires
  soonest. The whole Claude API is passed through byte for byte (streaming, tools, files, batches,
  Managed Agents); only the API key is swapped.


  The dashboard shows the remaining credit per key and for the pool, reset dates, today's activity and
  the last requests, and lets you pause keys, correct a balance from the Console or rotate the pool key.


  Setup: put config.json into data/config and keys.json into data/secrets of this app's data folder
  (templates and documentation at https://github.com/julian27sg/umbrel-apps). The generated pool key is
  written to data/db/pool.key. API clients use http://umbrel.local:8787 as base URL with the pool key;
  the /v1/* paths do not require the umbrelOS login, the dashboard does.
developer: Julian
website: https://github.com/julian27sg/umbrel-apps
submitter: julian27sg
submission: https://github.com/julian27sg/umbrel-apps
repo: https://github.com/julian27sg/umbrel-apps
support: https://github.com/julian27sg/umbrel-apps/issues
gallery: []
releaseNotes: >-
  Hardening release. A request no longer fails because one account runs dry mid-run: an empty balance is
  confirmed with a one-token probe before a key is parked, request header hygiene stops one bad request
  from disabling every key, and disabled/suspended organizations are recognised and probed daily. Streams
  stay alive during long thinking phases (keepalive comments, 10-minute idle timeout) and OpenAI-format
  streams end cleanly on errors. Routing: a 529 overload is relayed at once, other 5xx errors are retried
  once on another key (never for requests that create files or batches), the pool answers 429 with
  retry-after when every key is rate-limited, effort suffixes also work for count_tokens and batches, and
  chat completions are recognised by path. Files, batches, sessions, agents, vaults and deployments stay
  bound to their organization; reads and deletes on them keep working while that key is exhausted. New
  overdraft guard pauses a key that spends beyond its monthly credit without Anthropic reporting an empty
  balance. The dashboard reports configuration problems, probe results and alerts; a missing secret no
  longer prevents the start.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
