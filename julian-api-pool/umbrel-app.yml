manifestVersion: 1
id: julian-api-pool
storage:
  dataRoot: data
name: API Pool
tagline: One Anthropic API key, routed across your Console organizations by remaining credit
category: developer
version: "0.3.1"
port: 8787
description: >-
  api-pool sits in front of several Anthropic Console organizations and exposes your own client keys.
  Every request goes to the organization whose monthly subscriber credit still has balance and expires
  soonest. The whole Claude API is passed through byte for byte (streaming, tools, files, batches,
  Managed Agents); only the API key is swapped. OpenAI-format chat clients are translated as well.


  The dashboard has its own login (password + authenticator app) and shows the remaining credit per
  organization and for the pool, reset dates, usage per client key or organization by model, the last
  requests with their origin, a timeline of key events and alerts. You create one client key per app,
  rename or revoke them, pause organizations, correct a balance from the Console and configure push
  alerts through ntfy.


  Setup: put keys.json into data/secrets (and an optional config.json into data/config) of this app's
  data folder, restart, read the first client key "default" from data/db/pool.key, then open the dashboard
  once to set up the login with that key and create per-app keys. API clients use
  https://umbrel.local:8787 as base URL with a client key; the /v1/* paths do not require the umbrelOS
  login, the dashboard does. Templates and documentation: https://github.com/julian27sg/umbrel-apps
developer: Julian
website: https://github.com/julian27sg/umbrel-apps
submitter: julian27sg
submission: https://github.com/julian27sg/umbrel-apps
repo: https://github.com/julian27sg/umbrel-apps
support: https://github.com/julian27sg/umbrel-apps/issues
gallery: []
releaseNotes: >-
  Accuracy and OpenAI-format release. OpenAI clients get structured outputs (response_format json_schema
  and json_object), parallel_tool_calls, PDF and text file attachments, and a model list that shows every
  effort variant (claude-opus-5-5:xhigh and friends) in the app's model picker; openaiCache in config.json
  sets the prompt-cache TTL. Metering: advisor and compaction sub-inferences are priced at their own model,
  fast-mode cache prices are correct, a new model id is flagged as a pricing problem instead of silently
  priced like an older one, batch results are metered while they stream (a cut download no longer loses
  them), session responses are no longer double-booked, and a Console balance above the monthly credit is
  stored as a credit instead of a negative spend. The dashboard separates reachable from parked credit.
  Operations: memory limit, version in the startup log and footer, pinned release workflow.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
